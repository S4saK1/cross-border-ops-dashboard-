[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=html --cov-report=term --cov-report=xml"
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = [
    "tests/*",
    "scripts/*",
    "*/migrations/*",
    "*/alembic/*"
]

[tool.coverage.report]
# P0-9: Removed aggressive exclusions (pass/return None/except Exception)
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 120
