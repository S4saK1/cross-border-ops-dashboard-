# P0-4: ofelia 备份调度配置
# ofelia 是一个 Docker 原生任务调度器（替代 cron）
# 所有 job 使用 job-local 模式在 ofelia 容器内执行
# ofelia 容器已预装 postgresql-client + gzip（见 ofelia.Dockerfile）

[job-local "db-backup-daily"]
schedule = @daily
command = /bin/sh /scripts/backup.sh

[job-local "db-backup-weekly-full"]
schedule = @weekly
command = /bin/sh /scripts/backup.sh

[job-local "db-cleanup-old-backups"]
schedule = @weekly
command = find /backups -name "backup_*" -mtime +30 -delete

[job-local "backup-verify"]
schedule = @daily
command = ls -la /backups/

[job-local "backup-retention"]
schedule = @daily
command = find /backups -type f -mtime +30 -delete
