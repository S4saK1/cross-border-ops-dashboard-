# Production Nginx config with TLS + Security Headers
# Place SSL certificates at /etc/nginx/ssl/fullchain.pem and /etc/nginx/ssl/privkey.pem

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # 上传限制：后端允许 10MB 导入文件，nginx 默认 1m 会拦截
    client_max_body_size 10m;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Frontend
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Metrics (internal monitoring — 仅允许本机访问)
    # Prometheus 在容器网络内直连 backend:8000 抓取，不走 nginx；
    # 远程排障请使用 SSH 隧道或按需修改白名单。
    location /metrics/prometheus {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Health check (no auth)
    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
