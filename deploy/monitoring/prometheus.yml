global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警规则文件
rule_files:
  - "alerts.yml"

# 告警管理器配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics/prometheus'

  # 注意：node-exporter / cadvisor 服务未在 docker-compose.prod.yml 中定义，
  # 此前配置会持续报 target down；如需容器/主机级指标，请先添加对应服务再恢复此配置。
